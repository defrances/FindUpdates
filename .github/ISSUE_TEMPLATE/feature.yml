name: Engineering task
about: Define an implementation task with safety and acceptance criteria
title: ""
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome is required?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include explicit out-of-scope items when useful.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety / security considerations
      description: Describe fail-safe behavior, privileges, sensitive data and clinical/operational impact.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide observable, testable completion criteria.
    validations:
      required: true
