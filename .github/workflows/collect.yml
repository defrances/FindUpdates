name: Collect

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# No pull_request trigger: untrusted PRs must not hammer vendor feeds or
# confuse collection outages with merge status. This workflow never deploys.
permissions:
  contents: read

jobs:
  collect-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install development tools
        run: python -m pip install -r requirements-dev.lock
      - name: Dry-run collector polling
        env:
          PYTHONPATH: src
        run: python -m findupdates.collectors --dry-run --source all
