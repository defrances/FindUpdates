name: Detect updates

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Advisory source. fixtures is deterministic; live polls MSRC/Intel.
        type: choice
        options:
          - fixtures
          - live
        default: fixtures

# No pull_request trigger: untrusted PRs must not poll vendors or create
# notification noise. This workflow never deploys.
permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      FINDUPDATES_AI_ENABLED: "true"
      FINDUPDATES_AI_PROVIDER: offline
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install development tools
        run: python -m pip install -r requirements-dev.lock
      - name: Detect, analyze, notify
        env:
          DETECT_SOURCE: ${{ github.event.inputs.source || 'fixtures' }}
        run: |
          set +e
          SOURCE="${DETECT_SOURCE}"
          OUT="${RUNNER_TEMP}/findupdates-detect"
          mkdir -p "${OUT}"
          if [ "${SOURCE}" = "live" ]; then
            python -m findupdates.pipeline detect \
              --source live \
              --inventory configs/inventory/synthetic-workstations.json \
              --output-dir "${OUT}"
          else
            python -m findupdates.pipeline detect \
              --source fixtures \
              --output-dir "${OUT}"
          fi
          status=$?
          if [ -f "${OUT}/report.md" ]; then
            cat "${OUT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${status}"
      - name: Upload detect artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findupdates-detect
          path: ${{ runner.temp }}/findupdates-detect
          if-no-files-found: warn
          retention-days: 14
