[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "findupdates"
version = "0.1.0"
description = "Safety-conscious update intelligence and orchestration for medical-device environments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - development prototype" }
authors = [{ name = "FindUpdates contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["findupdates"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["findupdates"]
